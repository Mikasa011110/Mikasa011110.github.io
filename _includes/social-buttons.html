{% assign p = site.data.profile %}
{% assign current_lang = page.lang | default: 'en' %}
{% assign t = site.data.i18n[current_lang] %}
<div class="social-actions">
  <a class="button button-primary" href="{{ p.cv | relative_url }}" target="_blank" rel="noopener">{{ t.actions.cv }}</a>
  <a class="button button-secondary" href="{{ p.github }}" target="_blank" rel="noopener">{{ t.actions.github }}</a>
  {% unless p.google_scholar contains 'YOUR_' %}
  <a class="button button-secondary" href="{{ p.google_scholar }}" target="_blank" rel="noopener">{{ t.actions.scholar }}</a>
  {% else %}
  <a class="button button-secondary is-placeholder" href="#" title="Set google_scholar in _data/profile.yml">{{ t.actions.scholar }}</a>
  {% endunless %}
</div>
