---
layout: default
---
<article class="blog-post-page">
  <section class="page-hero blog-post-hero">
    <div class="container narrow">
      <a class="back-link" href="{{ '/blogs/' | relative_url }}">← Blogs</a>
      <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
      <h1>{{ page.title }}</h1>
      <p class="page-lead">{{ page.summary }}</p>
      {% if page.tags %}<div class="tag-row hero-tags">{% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>{% endif %}
    </div>
  </section>
  <section class="section">
    <div class="container narrow prose blog-prose">{{ content }}</div>
  </section>
</article>
