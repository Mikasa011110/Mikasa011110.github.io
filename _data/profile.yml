research_interests:
  - title: "World Model"
    description: "Humans enter the world with instincts shaped by hundreds of millions of years of evolution. We move, perceive, and interact with the physical world so naturally that we rarely question how much prior knowledge these abilities rely on. For robots, the same world is far less forgiving. It is uncertain, dynamic, and often difficult to predict. To understand it, robots must learn through vision, touch, and sound; to act within it, they must learn from successful behaviour, experience, and failure. In this sense, a robot is much like a newborn child—gradually discovering the structure of the physical world through perception, interaction, and learning."
    keywords: "Perception · Spatial Reasoning · VLM/VLA · World Models"
  - title: "Reinforcement Learning"
    description: "Learning through trial and error, an agent gradually turns clumsy exploration into purposeful behaviour. Every rollout is a gamble, every reward a signal, and every convergence feels like a small miracle."
    keywords: "PPO · DQN · Robot Learning"

