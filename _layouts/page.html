---
layout: default
---
<section class="page-hero">
  <div class="container narrow">
    {% if page.kicker %}<p class="section-kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="page-lead">{{ page.description }}</p>{% endif %}
  </div>
</section>
<section class="section page-content-section">
  <div class="container narrow prose">{{ content }}</div>
</section>
