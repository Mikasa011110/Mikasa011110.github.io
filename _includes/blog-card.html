<article class="blog-card">
  <a class="blog-cover" href="{{ include.post.url | relative_url }}">
    <img src="{{ include.post.cover_image | relative_url }}" alt="{{ include.post.title }} cover image" loading="lazy">
  </a>
  <div class="blog-card-body">
    <p class="eyebrow">{{ include.post.date | date: "%B %-d, %Y" }}</p>
    <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
    <p>{{ include.post.summary }}</p>
    {% if include.post.tags %}
    <div class="tag-row">
      {% for tag in include.post.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
</article>
